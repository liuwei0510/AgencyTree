  input_types: {}
  output_types:
    video: video_path
  capability: Re-sync a speaker's mouth in footage you already shot to a new speech
    track with VEED Lipsync 2.0. The person on camera speaks the new audio while the
    rest of the shot stays as recorded; the output keeps the video's resolution at
    25 fps and runs as long as the audio, up to 600 seconds. If the clip is shorter
    than the speech it plays forward and backward until the audio ends. Ideal for
    dubbing a line, swapping a script without re-shooting, or making localized versions
    of existing footage.
