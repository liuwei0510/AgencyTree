  capability: Generate a game-ready 3D model from a single image with Meshy T2.5.
    Meshy T2.5 builds the mesh at the triangle budget you set instead of generating
    a dense mesh and retopologizing it afterwards, so the result drops straight into
    a game engine. Texturing with PBR maps is optional and runs at 2k, 4k or 8k. Ideal
    for turning concept art, product photos and sculpts into engine-ready props.
