id: core.generative.text_to_video.video_ltx2_t2v
title: video_ltx2_t2v
modality:
- video
description: ComfyUI API workflow (imported from model_apis/video_ltx2_t2v.json).
tags:
- text-to-video
- t2v
- generative
workflow_file: video_ltx2_t2v.workflow.json
inject:
  prompt:
    node_id: '92:3'
    input_key: text
  negative_prompt:
    node_id: '92:4'
    input_key: text
  scale_factor:
    node_id: 92:90
    input_key: scale_by
    widget_index: null
  width:
    node_id: 92:89
    input_key: width
    widget_index: null
  height:
    node_id: 92:89
    input_key: height
    widget_index: null
  noise_seed:
    node_id: 92:67
    input_key: noise_seed
    widget_index: null
  noise_seed_2:
    node_id: '92:11'
    input_key: noise_seed
    widget_index: null
inputs:
- name: prompt
  type: string
  required: true
- name: negative_prompt
  type: string
  required: false
  default: ''
- name: scale_factor
  type: number
  required: false
  default: 0.5
- name: width
  type: number
  required: false
  default: 1280
- name: height
  type: number
  required: false
  default: 720
- name: noise_seed
  type: number
  required: false
  default: 0
- name: noise_seed_2
  type: number
  required: false
  default: 10
outputs:
- name: video
  type: video_path
  description: ComfyUI SaveVideo outputs
