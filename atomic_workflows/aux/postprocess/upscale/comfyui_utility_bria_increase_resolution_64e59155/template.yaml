  output_types: {}
  capability: Upscale any image to higher resolutions using Bria's dedicated resolution
    enhancement API, which preserves original content without adding new details or
    regenerating the image. The workflow accepts a single input image and produces
    one enhanced, higher-resolution output, supporting JPEG and PNG files in RGB,
    RGBA, or CMYK color modes up to a maximum area of 8192x8192 pixels. Built-in content
    moderation scans both the input image and generated output to ensure safe, policy-compliant
    processing. Ideal for preparing images for print, enlarging photos for digital
    display, or increasing resolution of assets for professional design work.
