  capability: 'Upscale a video with Clarity AI''s Crystal model, running through the
    Fal proxy: one video in, one upscaled video out. Set scale_factor to multiply
    the frame size, and the output keeps the source resolution, frame count and audio
    track. The result is capped at 9 megapixels per frame and 360 megapixel-seconds
    per clip, so long or oversized clips come back upscaled by less than the factor
    you asked for. Ideal for restoring generated clips, preparing footage for large
    screens, and sharpening soft AI video.'
