  capability: Generate a precisely edited image from a text prompt and up to five
    input images using Ideogram 4.5, where image 1 is the image to edit and images
    2-5 are optional references. Only what the prompt asks for changes, so untouched
    pixels stay identical and the output keeps the size of image 1, with a choice
    of quality tiers. Ideal for product recolours and material swaps, replacing one
    element of a photo without disturbing its lighting, background, or framing, and
    touch-ups that must leave the rest of the image alone.
