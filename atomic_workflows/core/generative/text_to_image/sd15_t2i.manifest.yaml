id: core.generative.text_to_image.sd15_t2i
title: Text to Image (SD 1.5 slot)
modality:
- image
description: Classic SD1.5-sized latent pipeline slot; swap checkpoint in workflow
  JSON.
tags:
- t2i
- sd15
- generative
workflow_file: sd15_t2i.workflow.json
inject:
  prompt:
    node_id: '6'
    input_key: text
  negative_prompt:
    node_id: '7'
    input_key: text
  width:
    node_id: '5'
    input_key: width
  height:
    node_id: '5'
    input_key: height
  seed:
    node_id: '10'
    input_key: seed
  model_file:
    node_id: '4'
    input_key: ckpt_name
    widget_index: null
inputs:
- name: prompt
  type: string
  required: true
- name: negative_prompt
  type: string
  required: false
  default: ''
- name: width
  type: int
  required: false
  default: 512
- name: height
  type: int
  required: false
  default: 512
- name: seed
  type: int
  required: false
- name: model_file
  type: string
  required: true
  default: null
outputs:
- name: images
  type: image_filenames
