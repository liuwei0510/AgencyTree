id: core.generative.text_to_image.sdxlturbo_example
title: sdxlturbo_example
modality:
- image
description: ComfyUI API workflow (imported from model_apis/sdxlturbo_example.json).
tags:
- text-to-image
- t2i
- generative
workflow_file: sdxlturbo_example.workflow.json
inject:
  prompt:
    node_id: '6'
    input_key: text
  negative_prompt:
    node_id: '7'
    input_key: text
  width:
    node_id: '5'
    input_key: width
  height:
    node_id: '5'
    input_key: height
  noise_seed:
    node_id: '13'
    input_key: noise_seed
    widget_index: null
inputs:
- name: prompt
  type: string
  required: true
- name: negative_prompt
  type: string
  required: false
  default: ''
- name: width
  type: int
  required: false
  default: 1024
- name: height
  type: int
  required: false
  default: 1024
- name: noise_seed
  type: number
  required: false
  default: 0
outputs:
- name: images
  type: image_filenames
  description: ComfyUI media outputs
