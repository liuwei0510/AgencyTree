  capability: 'Place objects and text where you want them with FLUX 3 Image by feeding
    boxes from the Create Bounding Boxes node into the prompt, so each box carries
    its own description and copy into the render. Boxes are relative to the canvas,
    so set the output to the same aspect ratio. One image is output, up to 4K. Ideal
    for poster and layout composition, placing headlines and captions, and controlling
    where subjects sit in the frame.

