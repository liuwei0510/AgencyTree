  capability: 'Edit an image with local open-weights Fibo 2.0 Edit Turbo (int8) and
    an optional prompt enhancer: a local vision LLM reads the reference image and
    rewrites your instruction into the structured caption Fibo 2.0 was trained on
    before TextEncodeFibo2 samples 4 steps at CFG 1. Switch the enhancer off to feed
    your raw prompt, and compare the result against the source in the built-in image
    compare node. Ideal for fast instruction-based retouches that keep identity and
    composition.'
