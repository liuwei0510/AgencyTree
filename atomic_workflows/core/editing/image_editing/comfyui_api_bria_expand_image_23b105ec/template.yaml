  capability: Expand an image beyond its original borders using Bria's outpainting
    API, generating new surrounding content that matches the original lighting, perspective,
    and texture while leaving the source untouched. Choose from preset aspect ratios,
    custom dimensions, or manual canvas placement, with optional text prompts to guide
    the expansion direction or an auto-generated prompt when left blank. Ideal for
    extending compositions for print layouts, creating panoramic versions of existing
    photos, and adapting artwork to new formats or social media dimensions.
