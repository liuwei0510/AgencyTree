id: core.editing.video_editing.video_humo
title: video_humo
modality:
- video
description: ComfyUI API workflow (imported from model_apis/video_humo.json).
tags:
- video-editing
- video-edit
workflow_file: video_humo.workflow.json
inject:
  prompt:
    node_id: '6'
