  capability: Estimate fine-detailed geometry from a single image with MoGe 3, the
    sparse-volumetric refinement version of MoGe. It lifts a coarse point map onto
    a sparse voxel shell and refines depth with lightweight sparse 3D convolutions,
    keeping thin structures and depth discontinuities that image-space decoders blur.
    Ships with the ViT-L checkpoint; the ViT-G file is selectable in the same Load
    MoGe Model dropdown for higher fine-detail accuracy. Takes 1 image input and outputs
    1 depth map and 1 normal map.
